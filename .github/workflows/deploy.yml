name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test tests/IntakeLog.Core.Tests -c Release

      # GitHub Pages serves project sites from /<repo>/. Set the base path
      # BEFORE publishing so the offline cache's file hashes stay correct.
      - name: Set base path
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          sed -i "s|<base href=\"/\" />|<base href=\"$BASE\" />|" src/IntakeLog.Web/wwwroot/index.html
          grep -o '<base[^>]*>' src/IntakeLog.Web/wwwroot/index.html

      - name: Publish
        run: dotnet publish src/IntakeLog.Web -c Release -o out

      # 404.html lets deep links like /trends load the app; .nojekyll keeps _framework/.
      - name: Prepare Pages files
        run: |
          cp out/wwwroot/index.html out/wwwroot/404.html
          touch out/wwwroot/.nojekyll

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: out/wwwroot

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
