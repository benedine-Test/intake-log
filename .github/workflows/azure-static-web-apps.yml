name: Test and deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test -c Release

      - name: Publish web app
        run: dotnet publish src/IntakeLog.Web -c Release -o out/web

      - name: Publish API
        run: dotnet publish src/IntakeLog.Api -c Release -o out/api

      # Pull requests only build and test; pushes to main deploy.
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: out/web/wwwroot
          api_location: out/api
          output_location: ""
          skip_app_build: true
          skip_api_build: true
